<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Top-Down Zombie Shooter</title>
<meta name="description" content="A 2D top-down survival wave shooter." />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./icons/app-icon.svg" />
<!-- On a phone, "Add to Home Screen" is worth a third more screen: Safari's
     bars go away and the game runs edge to edge. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Zombie Shooter" />
<meta name="theme-color" content="#07080b" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="frame">
    <div id="stage">
      <canvas id="game" width="800" height="500"></canvas>
    </div>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script src="./game-config.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
